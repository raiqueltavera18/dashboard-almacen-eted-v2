<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETED - Ficha de Consulta</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ============================================================
   SISTEMA DE COLOR — mismo esquema que el dashboard principal,
   copiado tal cual para que esta pestaña de consulta luzca
   idéntica (mismo tema claro/oscuro, mismas superficies).
   ============================================================ */
:root[data-theme="light"]{
  color-scheme: light;
  --page:#eef1f6; --surface:#ffffff; --surface-2:#f8f9fb; --surface-sunk:#f1f3f7;
  --text-primary:#0b0f19; --text-secondary:#52586b; --text-muted:#8a8fa0;
  --grid:#e4e7ee; --baseline:#c7cbd6; --border:rgba(11,15,25,.09); --border-strong:rgba(11,15,25,.14);
  --blue:#2a78d6; --orange:#eb6834; --aqua:#1baf7a; --yellow:#eda100;
  --magenta:#e87ba4; --green:#008300; --violet:#4a3aa7; --red:#e34948;
  --good:#0ca30c; --warning:#c17d00; --serious:#b04a26; --critical:#c62d2d;
  --good-bg:#e8f7e8; --warning-bg:#fdf1da; --serious-bg:#fbe6dc; --critical-bg:#fbe4e4;
  --brand-navy-1:#0a1a3f; --brand-navy-2:#122a5e; --brand-accent:#dc2626;
  --shadow-card: 0 1px 2px rgba(11,15,25,.04), 0 8px 24px -12px rgba(11,15,25,.10);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#212120; --surface-sunk:#161615;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8f8d84;
  --grid:#2c2c2a; --baseline:#3a3a37; --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.16);
  --blue:#3987e5; --orange:#d95926; --aqua:#199e70; --yellow:#c98500;
  --magenta:#d55181; --green:#3ec93e; --violet:#9085e9; --red:#e66767;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#e05a5a;
  --good-bg:rgba(12,163,12,.14); --warning-bg:rgba(250,178,25,.14); --serious-bg:rgba(236,131,90,.14); --critical-bg:rgba(224,90,90,.16);
  --brand-navy-1:#0a1a3f; --brand-navy-2:#122a5e; --brand-accent:#f04747;
  --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*{ font-variant-numeric: proportional-nums; }
body{ background:var(--page); color:var(--text-primary); transition: background .2s ease; }
.tabular{ font-variant-numeric: tabular-nums; }
.text-secondary{ color:var(--text-secondary); }
.text-muted{ color:var(--text-muted); }
.card{ background:var(--surface); border:1px solid var(--border); box-shadow: var(--shadow-card); border-radius:1rem; }
.surface-2{ background:var(--surface-2); }
.surface-sunk{ background:var(--surface-sunk); }
.border-token{ border-color:var(--border); }
.custom-scrollbar::-webkit-scrollbar{width:6px;height:6px}
.custom-scrollbar::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
.stat-icon{ width:2.75rem; height:2.75rem; border-radius:.85rem; display:flex; align-items:center; justify-content:center; font-size:1.05rem; }
table thead th{ color:var(--text-muted); }
table tbody tr:nth-child(even){ background:var(--surface-2); }
table tbody tr:hover{ background:var(--surface-sunk); }
.kpi-value{ font-variant-numeric: proportional-nums; letter-spacing:-0.01em; }
.skeleton{ background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-sunk) 37%,var(--surface-2) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; }
@keyframes sk{ 0%{background-position:100% 50%} 100%{background-position:0 50%} }
</style>
</head>
<body class="font-sans antialiased min-h-screen pb-16">

<header class="p-5" style="background:linear-gradient(120deg,var(--brand-navy-1),var(--brand-navy-2)); border-bottom:3px solid var(--brand-accent);">
  <div class="max-w-[1100px] mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
    <div class="flex items-center space-x-4">
      <div class="bg-white text-blue-950 px-4 py-2 rounded-lg font-black tracking-tighter text-xl shadow-lg border border-white/40">ETED</div>
      <div>
        <h1 class="text-xl md:text-2xl font-black tracking-wide text-white">FICHA DE CONSULTA</h1>
        <p class="text-xs text-blue-200 font-bold tracking-widest uppercase mt-0.5">Gerencia de Almacén — Detalle</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-xs bg-white/10 hover:bg-white/20 text-white font-bold px-4 py-2.5 rounded-lg transition-all flex items-center gap-2 border border-white/20">
        <i class="fa-solid fa-arrow-left text-xs"></i> Volver al dashboard
      </a>
    </div>
  </div>
</header>

<main class="max-w-[1100px] mx-auto p-5 md:p-8 space-y-6">
  <div id="estadoCarga" class="card p-8 text-center text-secondary">
    <i class="fa-solid fa-spinner fa-spin mr-2"></i> Cargando datos de data.json...
  </div>
  <div id="contenido" class="space-y-6"></div>
</main>

<script>
const fmtInt = n => new Intl.NumberFormat('en-US').format(Math.round(n||0));
const fmtCurr = n => 'RD$ ' + new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const fmtPct = n => (n||0).toFixed(1) + '%';
const fmtCompactNum = n => {
  n = Number(n)||0;
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  if(abs >= 1e6){
    const millones = abs/1e6;
    if(millones >= 1000){
      return sign + new Intl.NumberFormat('en-US').format(Math.round(millones)) + ' MM';
    }
    return sign + millones.toFixed(2).replace(/\.00$/,'') + ' MM';
  }
  if(abs >= 1e3) return sign + (abs/1e3).toFixed(1).replace(/\.0$/,'') + 'K';
  return sign + fmtInt(abs);
};
const fmtCompactCurr = n => 'RD$ ' + fmtCompactNum(n);
const MESES = {1:'Ene',2:'Feb',3:'Mar',4:'Abr',5:'May',6:'Jun',7:'Jul',8:'Ago',9:'Sep',10:'Oct',11:'Nov',12:'Dic'};
function claseLabel(cl){ return cl==='101' ? 'Entrada (101)' : cl==='201' ? 'Salida (201)' : 'Clase ' + cl; }
function claseColor(cl){ return cl==='101' ? 'var(--blue)' : cl==='201' ? 'var(--red)' : 'var(--violet)'; }

let almCodeMap = {};
function buildAlmCodeMap(inv, mov){
  almCodeMap = {};
  inv.forEach(i=>{ if(i.alm && i.codAlm && !almCodeMap[i.alm]) almCodeMap[i.alm] = i.codAlm; });
  (mov||[]).forEach(m=>{ if(m.alm && m.codAlm && !almCodeMap[m.alm]) almCodeMap[m.alm] = m.codAlm; });
}
function almLabel(nombre){
  if(!nombre) return nombre;
  const cod = almCodeMap[nombre];
  return cod ? `${nombre} (${cod})` : nombre;
}

function qp(name){ return new URLSearchParams(location.search).get(name); }

// Esta pestaña hereda el tema (claro/oscuro) que tenía el dashboard en el
// momento del clic, para que no se sienta como una página distinta.
(function aplicarTemaHeredado(){
  const tema = qp('theme');
  if(tema === 'dark' || tema === 'light') document.documentElement.setAttribute('data-theme', tema);
})();

function cardWrap(titulo, subt, innerHtml, iconClass, colorVar){
  return `
    <div class="card p-5 md:p-6">
      <div class="flex items-start gap-3 mb-4">
        <div class="stat-icon flex-shrink-0" style="background:color-mix(in oklab, ${colorVar||'var(--blue)'} 14%, transparent); color:${colorVar||'var(--blue)'}"><i class="fa-solid ${iconClass||'fa-circle-info'}"></i></div>
        <div>
          <h2 class="text-base font-extrabold">${titulo}</h2>
          ${subt ? `<p class="text-xs text-secondary mt-0.5">${subt}</p>` : ''}
        </div>
      </div>
      ${innerHtml}
    </div>`;
}

function tabla(headers, rows, foot){
  return `<div class="overflow-x-auto -mx-1">
    <table class="w-full text-left border-collapse text-xs min-w-[480px]">
      <thead class="surface-2 uppercase font-bold border-b border-token">
        <tr>${headers.map(h=>`<th class="p-2.5${h.right?' text-right':''}">${h.label}</th>`).join('')}</tr>
      </thead>
      <tbody class="divide-y" style="border-color:var(--border)">${rows.join('')}</tbody>
      ${foot ? `<tfoot>${foot}</tfoot>` : ''}
    </table>
  </div>`;
}

async function init(){
  let data;
  try{
    const resp = await fetch('./data.json', { cache:'no-store' });
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    data = await resp.json();
  } catch(err){
    document.getElementById('estadoCarga').innerHTML = `<p style="color:var(--critical)"><i class="fa-solid fa-triangle-exclamation mr-2"></i>No se pudo cargar data.json (${err.message}). Abre esta ficha desde un enlace del dashboard, no como archivo suelto.</p>`;
    return;
  }
  const inv = data.inventario || [];
  const mov = data.movimientos || [];
  buildAlmCodeMap(inv, mov);
  document.getElementById('estadoCarga').remove();

  const tipo = qp('tipo');
  const cont = document.getElementById('contenido');
  try{
    if(tipo === 'material') cont.innerHTML = fichaMaterial(inv, mov, qp('cod'));
    else if(tipo === 'almacen') cont.innerHTML = fichaAlmacen(inv, mov, qp('alm'));
    else if(tipo === 'familia') cont.innerHTML = fichaFamilia(inv, qp('fam'));
    else if(tipo === 'kpi') cont.innerHTML = fichaKpi(inv, mov, qp('kpi'), qp('alm') || 'TODOS');
    else cont.innerHTML = `<div class="card p-8 text-center text-secondary">Enlace de consulta no reconocido.</div>`;
  } catch(err){
    cont.innerHTML = `<div class="card p-8 text-center" style="color:var(--critical)">Ocurrió un error al generar esta ficha: ${err.message}</div>`;
    console.error(err);
  }
}

// ---------------- Ficha de Material ----------------
function fichaMaterial(inv, mov, cod){
  const filas = inv.filter(i=>i.cod===cod);
  if(!filas.length) return `<div class="card p-8 text-center text-secondary">No se encontró el material <span class="font-mono font-bold">${cod}</span> en el inventario actual.</div>`;
  const { desc, fam } = filas[0];
  const disponibles = filas.filter(f=>f.cant>0);
  const ocultos = filas.length - disponibles.length;
  const totalCant = disponibles.reduce((a,f)=>a+f.cant,0);
  const totalValor = disponibles.reduce((a,f)=>a+f.valor,0);

  const movsCod = mov.filter(m=>m.cod===cod).sort((a,b)=> a.anio-b.anio || a.mes-b.mes);
  const totE = movsCod.filter(m=>m.clase==='101').length;
  const totS = movsCod.filter(m=>m.clase==='201').length;
  const totO = movsCod.length - totE - totS;

  const cabecera = `
    <div class="card p-5 md:p-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div>
          <span class="font-mono font-bold text-lg" style="color:var(--blue)">${cod}</span>
          <span class="font-extrabold text-lg ml-2">${desc}</span>
          <div class="mt-1.5 flex flex-wrap gap-2">
            ${fam ? `<span class="text-[11px] font-bold px-2.5 py-1 rounded-full surface-sunk border border-token">${fam}</span>` : ''}
            <span class="text-[11px] font-bold px-2.5 py-1 rounded-full" style="background:${disponibles.length?'var(--good-bg)':'var(--critical-bg)'}; color:${disponibles.length?'var(--good)':'var(--critical)'}">
              ${disponibles.length ? `Disponible en ${disponibles.length} de ${filas.length} almacén(es)` : 'Sin existencia en ningún almacén'}
            </span>
          </div>
        </div>
      </div>
    </div>`;

  const filasExistencia = disponibles.map(f=>`
    <tr><td class="p-2.5 font-semibold">${almLabel(f.alm)}</td>
    <td class="p-2.5 text-right font-mono tabular font-bold" style="color:var(--good)">${fmtInt(f.cant)} ${f.uni}</td>
    <td class="p-2.5 text-right font-mono tabular text-secondary">${fmtCurr(f.valor)}</td></tr>`);
  const footExistencia = `<tr class="surface-2 font-bold"><td class="p-2.5">TOTAL</td>
    <td class="p-2.5 text-right font-mono tabular" style="color:var(--good)">${fmtInt(totalCant)}</td>
    <td class="p-2.5 text-right font-mono tabular">${fmtCurr(totalValor)}</td></tr>`;

  const seccionExistencia = cardWrap('Existencia por almacén',
    disponibles.length ? 'Solo se listan almacenes con existencia mayor que cero.' : null,
    disponibles.length
      ? tabla([{label:'Almacén'},{label:'Cantidad',right:true},{label:'Valor (RD$)',right:true}], filasExistencia, footExistencia)
        + (ocultos>0 ? `<p class="text-[10px] text-muted italic pt-2">Se ${ocultos===1?'oculta 1 almacén':'ocultan '+ocultos+' almacenes'} sin existencia de este material.</p>` : '')
      : `<p class="text-xs text-secondary italic">Este material no tiene existencia disponible en ningún almacén actualmente.</p>`,
    'fa-warehouse', 'var(--good)');

  const filasMov = movsCod.map(m=>`
    <tr><td class="p-2.5 font-semibold">${MESES[m.mes]||m.mes} ${m.anio}</td>
    <td class="p-2.5"><span class="font-bold text-[11px] px-2 py-0.5 rounded-full" style="color:${claseColor(m.clase)}; background:color-mix(in oklab, ${claseColor(m.clase)} 14%, transparent)">${claseLabel(m.clase)}</span></td>
    <td class="p-2.5">${almLabel(m.alm)}</td>
    <td class="p-2.5 font-mono text-secondary">${m.doc||'—'}</td></tr>`);

  const seccionMov = cardWrap('Historial de movimientos',
    movsCod.length ? `${totE} entrada(s) · ${totS} salida(s)${totO? ' · '+totO+' otro(s)':''}, registrados en el periodo disponible.` : null,
    movsCod.length
      ? tabla([{label:'Periodo'},{label:'Tipo'},{label:'Almacén'},{label:'Documento'}], filasMov)
      : `<p class="text-xs text-secondary italic">Este material no tiene movimientos registrados en el periodo disponible.</p>`,
    'fa-clock-rotate-left', 'var(--violet)');

  return cabecera + seccionExistencia + seccionMov;
}

// ---------------- Ficha de Almacén ----------------
function fichaAlmacen(inv, mov, alm){
  const filas = inv.filter(i=>i.alm===alm).sort((a,b)=>b.valor-a.valor);
  if(!filas.length) return `<div class="card p-8 text-center text-secondary">No se encontró el almacén <span class="font-bold">${alm}</span> en el inventario actual.</div>`;
  const totalCant = filas.reduce((a,f)=>a+f.cant,0);
  const totalValor = filas.reduce((a,f)=>a+f.valor,0);
  const movsAlm = mov.filter(m=>m.alm===alm);
  const entradas = movsAlm.filter(m=>m.clase==='101').length;
  const salidas = movsAlm.filter(m=>m.clase==='201').length;

  const cabecera = `
    <div class="card p-5 md:p-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h2 class="text-lg font-extrabold">${almLabel(alm)}</h2>
          <p class="text-xs text-secondary mt-1">${fmtInt(filas.length)} material(es) en existencia · ${entradas} entrada(s) y ${salidas} salida(s) registradas</p>
        </div>
        <div class="text-right">
          <p class="text-2xl font-black kpi-value" style="color:var(--blue)">${fmtCompactCurr(totalValor)}</p>
          <p class="text-[11px] text-secondary font-semibold">${fmtInt(totalCant)} unidades (todas las medidas)</p>
        </div>
      </div>
    </div>`;

  const filasHtml = filas.map(f=>`
    <tr><td class="p-2.5 font-mono font-semibold" style="color:var(--blue)">${f.cod}</td>
    <td class="p-2.5 max-w-[220px] truncate" title="${f.desc}">${f.desc}</td>
    <td class="p-2.5 text-secondary">${f.fam||'—'}</td>
    <td class="p-2.5 text-right font-mono tabular">${fmtInt(f.cant)} ${f.uni}</td>
    <td class="p-2.5 text-right font-mono tabular font-bold">${fmtCurr(f.valor)}</td></tr>`);
  const foot = `<tr class="surface-2 font-bold"><td class="p-2.5" colspan="3">TOTAL</td>
    <td class="p-2.5 text-right font-mono tabular">${fmtInt(totalCant)}</td>
    <td class="p-2.5 text-right font-mono tabular">${fmtCurr(totalValor)}</td></tr>`;

  const seccion = cardWrap('Materiales en este almacén', 'Ordenado de mayor a menor valor.',
    tabla([{label:'Código'},{label:'Descripción'},{label:'Familia'},{label:'Cantidad',right:true},{label:'Valor (RD$)',right:true}], filasHtml, foot),
    'fa-boxes-stacked', 'var(--orange)');

  return cabecera + seccion;
}

// ---------------- Ficha de Familia ----------------
function fichaFamilia(inv, fam){
  let filas, tituloFam = fam;
  if(fam === '__otras__'){
    const skusPorFam = {};
    inv.forEach(i=>{ const f = i.fam || 'Sin Familia'; (skusPorFam[f]=skusPorFam[f]||new Set()).add(i.cod); });
    const topFams = Object.entries(skusPorFam).map(([f,s])=>[f,s.size]).sort((a,b)=>b[1]-a[1]).slice(0,7).map(([f])=>f);
    filas = inv.filter(i=> !topFams.includes(i.fam || 'Sin Familia'));
    tituloFam = 'Otras familias (fuera del top 7 por cantidad de SKU)';
  } else {
    filas = inv.filter(i=> (i.fam || 'Sin Familia') === fam);
  }
  if(!filas.length) return `<div class="card p-8 text-center text-secondary">No se encontraron materiales para la familia <span class="font-bold">${tituloFam}</span>.</div>`;
  const sorted = [...filas].sort((a,b)=>b.valor-a.valor);
  const totalCant = filas.reduce((a,f)=>a+f.cant,0);
  const totalValor = filas.reduce((a,f)=>a+f.valor,0);
  const skuUnicos = new Set(filas.map(f=>f.cod)).size;

  const cabecera = `
    <div class="card p-5 md:p-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h2 class="text-lg font-extrabold">${tituloFam}</h2>
          <p class="text-xs text-secondary mt-1">${fmtInt(skuUnicos)} material(es) distinto(s) · ${fmtInt(filas.length)} registro(s) de existencia por almacén</p>
        </div>
        <div class="text-right">
          <p class="text-2xl font-black kpi-value" style="color:var(--blue)">${fmtCompactCurr(totalValor)}</p>
          <p class="text-[11px] text-secondary font-semibold">${fmtInt(totalCant)} unidades (todas las medidas)</p>
        </div>
      </div>
    </div>`;

  const filasHtml = sorted.map(f=>`
    <tr><td class="p-2.5 font-mono font-semibold" style="color:var(--blue)">${f.cod}</td>
    <td class="p-2.5 max-w-[200px] truncate" title="${f.desc}">${f.desc}</td>
    <td class="p-2.5">${almLabel(f.alm)}</td>
    <td class="p-2.5 text-right font-mono tabular">${fmtInt(f.cant)} ${f.uni}</td>
    <td class="p-2.5 text-right font-mono tabular font-bold">${fmtCurr(f.valor)}</td></tr>`);
  const foot = `<tr class="surface-2 font-bold"><td class="p-2.5" colspan="3">TOTAL</td>
    <td class="p-2.5 text-right font-mono tabular">${fmtInt(totalCant)}</td>
    <td class="p-2.5 text-right font-mono tabular">${fmtCurr(totalValor)}</td></tr>`;

  const seccion = cardWrap('Materiales de esta familia', 'Ordenado de mayor a menor valor, por almacén.',
    tabla([{label:'Código'},{label:'Descripción'},{label:'Almacén'},{label:'Cantidad',right:true},{label:'Valor (RD$)',right:true}], filasHtml, foot),
    'fa-tags', 'var(--violet)');

  return cabecera + seccion;
}

// ---------------- Ficha de KPI ----------------
function fichaKpi(inv, mov, kpi, almFiltro){
  const invSel = almFiltro==='TODOS' ? inv : inv.filter(i=>i.alm===almFiltro);
  const movSel = almFiltro==='TODOS' ? mov : mov.filter(m=>m.alm===almFiltro);
  const contexto = almFiltro==='TODOS' ? 'Vista general (todos los almacenes)' : 'Vista filtrada: ' + almLabel(almFiltro);

  const notaContexto = `<p class="text-xs text-secondary -mt-2">${contexto}</p>`;

  if(kpi === 'valorTotal'){
    const map = {};
    invSel.forEach(i=>{ map[i.alm] = (map[i.alm]||0) + i.valor; });
    const entries = Object.entries(map).sort((a,b)=>b[1]-a[1]);
    const total = entries.reduce((a,[,v])=>a+v,0) || 1;
    const filasHtml = entries.map(([alm,v])=>`
      <tr><td class="p-2.5 font-semibold">${almLabel(alm)}</td>
      <td class="p-2.5 text-right font-mono tabular font-bold">${fmtCurr(v)}</td>
      <td class="p-2.5 text-right font-mono tabular text-secondary">${fmtPct(v/total*100)}</td></tr>`);
    return notaContexto + cardWrap('Valor Total en Inventario — desglose por almacén', null,
      tabla([{label:'Almacén'},{label:'Valor (RD$)',right:true},{label:'% del total',right:true}], filasHtml,
        `<tr class="surface-2 font-bold"><td class="p-2.5">TOTAL</td><td class="p-2.5 text-right font-mono tabular">${fmtCurr(total)}</td><td class="p-2.5 text-right">100.0%</td></tr>`),
      'fa-sack-dollar', 'var(--blue)');
  }

  if(kpi === 'deadStock'){
    const movidos = new Set();
    movSel.forEach(m => movidos.add(m.cod + '|' + m.alm));
    const deadRows = invSel.filter(i=> i.valor>0 && !movidos.has(i.cod+'|'+i.alm)).sort((a,b)=>b.valor-a.valor);
    const totalValor = deadRows.reduce((a,f)=>a+f.valor,0);
    const filasHtml = deadRows.map(f=>`
      <tr><td class="p-2.5 font-mono font-semibold" style="color:var(--blue)">${f.cod}</td>
      <td class="p-2.5 max-w-[200px] truncate" title="${f.desc}">${f.desc}</td>
      <td class="p-2.5">${almLabel(f.alm)}</td>
      <td class="p-2.5 text-right font-mono tabular">${fmtInt(f.cant)} ${f.uni}</td>
      <td class="p-2.5 text-right font-mono tabular font-bold" style="color:var(--critical)">${fmtCurr(f.valor)}</td></tr>`);
    return notaContexto + cardWrap('Capital Inmovilizado — materiales sin movimiento', deadRows.length + ' material(es) sin ningún movimiento registrado en el periodo disponible.',
      deadRows.length
        ? tabla([{label:'Código'},{label:'Descripción'},{label:'Almacén'},{label:'Cantidad',right:true},{label:'Valor (RD$)',right:true}], filasHtml,
          `<tr class="surface-2 font-bold"><td class="p-2.5" colspan="4">TOTAL</td><td class="p-2.5 text-right font-mono tabular" style="color:var(--critical)">${fmtCurr(totalValor)}</td></tr>`)
        : `<p class="text-xs text-secondary italic">No hay materiales sin movimiento en esta vista — buena señal.</p>`,
      'fa-triangle-exclamation', 'var(--critical)');
  }

  if(kpi === 'dio'){
    const precioPorCodigo = {};
    const acumValor = {}, acumCant = {};
    inv.forEach(i=>{ acumValor[i.cod]=(acumValor[i.cod]||0)+i.valor; acumCant[i.cod]=(acumCant[i.cod]||0)+i.cant; });
    Object.keys(acumValor).forEach(c=>{ precioPorCodigo[c] = acumCant[c]>0 ? acumValor[c]/acumCant[c] : 0; });
    const valorSel = invSel.reduce((a,i)=>a+i.valor,0);
    const mov201 = movSel.filter(m=>m.clase==='201');
    let consumoValor = 0;
    const meses = new Set();
    mov201.forEach(m=>{ consumoValor += m.cant * (precioPorCodigo[m.cod]||0); meses.add(m.anio+'-'+m.mes); });
    const numMeses = meses.size || 1;
    const consumoDiario = consumoValor / (numMeses*30);
    const dias = consumoDiario>0 ? valorSel/consumoDiario : null;
    const filasHtml = [
      ['Valor en vista', fmtCurr(valorSel)],
      ['Salidas (clase 201) usadas en el cálculo', fmtInt(mov201.length) + ' movimiento(s)'],
      ['Valor total consumido (salidas × precio promedio)', fmtCurr(consumoValor)],
      ['Meses con datos de consumo', fmtInt(numMeses)],
      ['Consumo diario promedio', fmtCurr(consumoDiario)],
    ].map(([k,v])=>`<tr><td class="p-2.5 text-secondary">${k}</td><td class="p-2.5 text-right font-mono tabular font-bold">${v}</td></tr>`);
    return notaContexto + cardWrap('Días de Cobertura — cómo se calculó', 'Fórmula: Valor en vista ÷ Consumo diario promedio.',
      tabla([{label:'Componente'},{label:'Valor',right:true}], filasHtml)
      + `<div class="mt-4 p-4 rounded-xl surface-sunk border border-token text-center">
          <p class="text-[11px] font-bold uppercase text-muted tracking-wider">Resultado</p>
          <p class="text-2xl font-black kpi-value mt-1" style="color:var(--yellow)">${dias!==null ? fmtInt(dias)+' días (≈ '+fmtInt(dias/30)+' meses)' : 'N/D — sin salidas 201 para estimar consumo'}</p>
        </div>`,
      'fa-gauge-high', 'var(--yellow)');
  }

  if(kpi === 'salidas201'){
    const rows = movSel.filter(m=>m.clase==='201' && m.anio===2026).sort((a,b)=>a.mes-b.mes);
    const filasHtml = rows.map(m=>`
      <tr><td class="p-2.5 font-semibold">${MESES[m.mes]||m.mes} ${m.anio}</td>
      <td class="p-2.5 font-mono font-semibold" style="color:var(--blue)">${m.cod}</td>
      <td class="p-2.5 max-w-[200px] truncate" title="${m.desc||''}">${m.desc||'—'}</td>
      <td class="p-2.5">${almLabel(m.alm)}</td>
      <td class="p-2.5 font-mono text-secondary">${m.doc||'—'}</td></tr>`);
    return notaContexto + cardWrap('Salidas Clase 201 (2026)', fmtInt(rows.length) + ' movimiento(s) de salida registrados.',
      rows.length
        ? tabla([{label:'Periodo'},{label:'Código'},{label:'Descripción'},{label:'Almacén'},{label:'Documento'}], filasHtml)
        : `<p class="text-xs text-secondary italic">Sin salidas clase 201 registradas en 2026 para esta vista.</p>`,
      'fa-arrow-right-from-bracket', 'var(--aqua)');
  }

  if(kpi === 'skuVista'){
    const sorted = [...invSel].sort((a,b)=>b.valor-a.valor);
    const totalCant = sorted.reduce((a,f)=>a+f.cant,0);
    const totalValor = sorted.reduce((a,f)=>a+f.valor,0);
    const filasHtml = sorted.map(f=>`
      <tr><td class="p-2.5 font-mono font-semibold" style="color:var(--blue)">${f.cod}</td>
      <td class="p-2.5 max-w-[200px] truncate" title="${f.desc}">${f.desc}</td>
      <td class="p-2.5 text-secondary">${f.fam||'—'}</td>
      <td class="p-2.5">${almLabel(f.alm)}</td>
      <td class="p-2.5 text-right font-mono tabular">${fmtInt(f.cant)} ${f.uni}</td>
      <td class="p-2.5 text-right font-mono tabular font-bold">${fmtCurr(f.valor)}</td></tr>`);
    const foot = `<tr class="surface-2 font-bold"><td class="p-2.5" colspan="4">TOTAL</td>
      <td class="p-2.5 text-right font-mono tabular">${fmtInt(totalCant)}</td>
      <td class="p-2.5 text-right font-mono tabular">${fmtCurr(totalValor)}</td></tr>`;
    return notaContexto + cardWrap('Materiales (SKU) en Vista', fmtInt(sorted.length) + ' material(es) en esta vista, ordenados de mayor a menor valor.',
      tabla([{label:'Código'},{label:'Descripción'},{label:'Familia'},{label:'Almacén'},{label:'Cantidad',right:true},{label:'Valor (RD$)',right:true}], filasHtml, foot),
      'fa-cubes', 'var(--aqua)');
  }

  return `<div class="card p-8 text-center text-secondary">KPI no reconocido: ${kpi}</div>`;
}

init();
</script>
</body>
</html>
